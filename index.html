  <title>Nemat (نعمت) — Surplus Food Rescue Platform | Islamabad</title>
  <meta name="description" content="Nemat connects Islamabad bakeries and cafés to citizens for discounted surprise surplus bags and routes unsold meals to civic volunteer rescue networks.">

  <!-- PWA & Mobile Web App Meta -->

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

      main > :first-child {
        margin-top: 0 !important;

      main > :last-child {
        margin-bottom: 0 !important;
      }
    }
    ::-webkit-scrollbar {
      display: none;
    }
